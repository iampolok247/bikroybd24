name: Deploy Laravel to cPanel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Fast Deploy Laravel to cPanel
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Checkout latest repository code
      uses: actions/checkout@v4

    - name: ⚙️ Setup PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, gd

    - name: 📦 Install Composer Dependencies (Production)
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

    - name: 🗜️ Package Application into ZIP Archive
      run: |
        mkdir -p deploy_pkg
        zip -r deploy_pkg/release.zip . -x "*.git*" "*.github*" "deploy_pkg/*" "tests/*" ".env*" "frontend/*" "backend/*"
        
        cat << 'EOF' > deploy_pkg/deploy_extract.php
        <?php
        $secret = 'bikroybd24_deploy_token_9921';
        if (isset($_GET['token']) && $_GET['token'] === $secret) {
            $zipFile = __DIR__ . '/release.zip';
            if (!file_exists($zipFile)) {
                die("Error: release.zip not found in " . __DIR__);
            }
            $zip = new ZipArchive;
            if ($zip->open($zipFile) === TRUE) {
                $zip->extractTo(__DIR__);
                $zip->close();
                @unlink($zipFile);
                @unlink(__FILE__);
                echo "SUCCESS: Application extracted and updated successfully!";
            } else {
                echo "FAILED: Could not open release.zip";
            }
        } else {
            http_response_code(403);
            echo "Forbidden: Invalid deploy token";
        }
        EOF

    - name: 📂 Upload Files to cPanel via cURL (Firewall & Passive Port Safe)
      env:
        FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
        FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
        FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        FTP_DIR: ${{ secrets.CPANEL_SERVER_DIR }}
      run: |
        TARGET_DIR="${FTP_DIR:-}"
        # Clean leading and trailing slashes
        TARGET_DIR=$(echo "$TARGET_DIR" | sed 's/^\///' | sed 's/\/$//')
        
        if [ -z "$TARGET_DIR" ] || [ "$TARGET_DIR" = "." ]; then
          FTP_PATH="ftp://${FTP_SERVER}"
        else
          FTP_PATH="ftp://${FTP_SERVER}/${TARGET_DIR}"
        fi

        echo "Uploading deploy_extract.php..."
        curl --max-time 60 --retry 3 -u "${FTP_USER}:${FTP_PASS}" -T deploy_pkg/deploy_extract.php "${FTP_PATH}/deploy_extract.php" || \
        curl --ssl -k --max-time 60 --retry 3 -u "${FTP_USER}:${FTP_PASS}" -T deploy_pkg/deploy_extract.php "${FTP_PATH}/deploy_extract.php"

        echo "Uploading release.zip..."
        curl --max-time 300 --retry 3 -u "${FTP_USER}:${FTP_PASS}" -T deploy_pkg/release.zip "${FTP_PATH}/release.zip" || \
        curl --ssl -k --max-time 300 --retry 3 -u "${FTP_USER}:${FTP_PASS}" -T deploy_pkg/release.zip "${FTP_PATH}/release.zip"

        echo "Upload completed successfully!"

    - name: ⚡ Trigger Server Unzip Extraction
      run: |
        echo "Extracting release on cPanel server..."
        sleep 2
        curl -s -k -L "http://${{ secrets.CPANEL_FTP_SERVER }}/deploy_extract.php?token=bikroybd24_deploy_token_9921" || true
        curl -s -k -L "https://bikroybd24.com/deploy_extract.php?token=bikroybd24_deploy_token_9921" || true
        curl -s -k -L "http://151.158.44.116/deploy_extract.php?token=bikroybd24_deploy_token_9921" || true
        echo "Deployment finished successfully!"
