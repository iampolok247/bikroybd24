name: Deploy Laravel to cPanel

on:
  push:
    branches: [ main, master ]

jobs:
  web-deploy:
    name: 🎉 Deploy Laravel to cPanel
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Checkout latest repository code
      uses: actions/checkout@v4

    - name: ⚙️ Setup PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, gd

    - name: 📦 Install Composer Dependencies (Production)
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

    - name: 📂 Sync Files to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.CPANEL_FTP_SERVER }}
        username: ${{ secrets.CPANEL_FTP_USERNAME }}
        password: ${{ secrets.CPANEL_FTP_PASSWORD }}
        server-dir: ${{ secrets.CPANEL_SERVER_DIR || './' }}
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/frontend/**
          **/backend/**
          **/tests/**
          .env.example
          .gitignore
          README.md
