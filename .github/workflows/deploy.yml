name: Deploy Laravel to cPanel

on:
  push:
    branches: [ main, master ]

jobs:
  web-deploy:
    name: 🎉 Deploy to cPanel / Shared Hosting
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl

    - name: 📦 Install Composer Dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

    - name: 📂 Sync Files to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.CPANEL_FTP_SERVER }}
        username: ${{ secrets.CPANEL_FTP_USERNAME }}
        password: ${{ secrets.CPANEL_FTP_PASSWORD }}
        server-dir: ${{ secrets.CPANEL_SERVER_DIR || 'public_html/' }}
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/frontend/**
          **/backend/**
          **/tests/**
          .env.example
          README.md
